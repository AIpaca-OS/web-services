# Rumbo OS AV2 - public API preview on Render, not a production-ready IAM setup.
# IMPORTANT: do not store real student/guardian data until JWT + RBAC exist.
services:
  - type: web
    name: rumbo-os-backend
    runtime: docker
    repo: https://github.com/AIpaca-OS/web-services
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Bootstrap an EMPTY course-preview Postgres instance with Hibernate.
      # Change to "validate" after the initial schema is created.
      - key: SPRING_JPA_DDL_AUTO
        value: update
      - key: APP_DEMO_ENABLED
        value: "false"
      - key: APP_PROFILES_DEMO_ENABLED
        value: "false"
      - key: PROFILES_AUTHORIZATION_ENABLED
        value: "false"
      # Restricts private REST endpoints until IAM is implemented.
      # Obtain the generated key from Render's environment settings for Postman.
      - key: DEPLOYMENT_ACCESS_TOKEN
        generateValue: true
      - key: RENDER_POSTGRES_URL
        fromDatabase:
          name: rumbo-os-db
          property: connectionString

databases:
  - name: rumbo-os-db
    plan: free
    databaseName: rumbo
    user: rumbo
    postgresMajorVersion: "17"
    # App communicates with PostgreSQL via Render's private network only.
    ipAllowList: []
