spring.application.name=rumbo-web-services

# PostgreSQL (configure these values in Render; do not commit passwords)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rumbo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rumbo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Existing schema is maintained by the SQL scripts.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:none}

# Server
server.port=${PORT:8080}

# Local Angular origin by default. Set the deployed frontend URL in Render.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Profiles owns the security decision. Disabled until its verified endpoint is deployed.
profiles.authorization.enabled=${PROFILES_AUTHORIZATION_ENABLED:false}
profiles.authorization.base-url=${PROFILES_AUTHORIZATION_BASE_URL:}

# IAM: a unique 32+ byte random Base64 secret must be provided via JWT_SECRET.
authorization.jwt.secret=${JWT_SECRET:}
authorization.jwt.expiration.minutes=${JWT_EXPIRATION_MINUTES:60}
# SMTP must be configured to register verified accounts and reset passwords.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SMTP_FROM:no-reply@rumbo.invalid}
app.frontend.public-url=${FRONTEND_PUBLIC_URL:http://localhost:4200}
