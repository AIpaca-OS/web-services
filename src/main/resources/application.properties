spring.application.name=rumbo-web-services

# PostgreSQL (configure these values in Render; do not commit passwords)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rumbo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rumbo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Existing schema is maintained by the SQL scripts.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:none}

# Server
server.port=${PORT:8080}

# Local Angular origin by default. Set the deployed frontend URL in Render.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Profiles owns the security decision. Disabled until its verified endpoint is deployed.
profiles.authorization.enabled=${PROFILES_AUTHORIZATION_ENABLED:false}
profiles.authorization.base-url=${PROFILES_AUTHORIZATION_BASE_URL:}

# Keep demo-only notifications closed unless the local demo explicitly enables them.
app.demo.enabled=${APP_DEMO_ENABLED:false}
