# Spring Application Name
spring.application.name=Rumbo Web Services Platform

# Default to development when no explicit profile is provided.
spring.profiles.default=dev

# Shared Spring DataSource Configuration
spring.datasource.driver-class-name=org.postgresql.Driver

# Shared Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.naming.physical-strategy=com.aipaca.rumbo.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation
# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# CORS: allowed frontend origins, comma separated
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Concurrency & Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true
