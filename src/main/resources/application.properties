spring.application.name=rumbo-web-services

# PostgreSQL (configure these values in Render; do not commit passwords)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rumbo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rumbo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Existing schema is maintained by the SQL scripts.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# Server
server.port=${PORT:8080}

# Local Angular origin by default. Set the deployed frontend URL in Render.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
