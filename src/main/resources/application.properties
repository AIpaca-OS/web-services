spring.application.name=rumbo-web-services

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/rumbo
spring.datasource.username=rumbo
spring.datasource.password=${DB_PASSWORD}

# Spring Data JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# Server
server.port=8080