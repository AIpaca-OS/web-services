# Development profile
# Use Dockerfile-compatible environment variable names with local defaults.
###    JDBC : SGDB :// HOST : PORT / DB
spring.datasource.url=jdbc:postgresql://${DATABASE_URL:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:rumbo}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Developer-friendly JPA behavior
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# App port. There is no authentication yet, so the API listens on loopback only.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
