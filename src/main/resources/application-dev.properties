# Developer setup only. PostgreSQL must exist; Hibernate creates missing tables.
# Keep DB credentials in the process environment; never commit local passwords.
server.address=127.0.0.1
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rumbo_demo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# The demo identity is opt-in and restricted to the local profile, not dev.
app.profiles.demo.enabled=false
app.demo.enabled=${APP_DEMO_ENABLED:false}
