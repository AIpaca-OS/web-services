# Public deployment: database and frontend URL must be provided at runtime.
# Do not enable local-demo identity or notifications on public deployments.
# RenderPostgresBootstrap resolves RENDER_POSTGRES_URL into JDBC settings at startup.
# Explicit SPRING_DATASOURCE_* variables are still supported for other providers.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.profiles.demo.enabled=false
app.demo.enabled=false
# The shared configuration already uses PORT (default 8080), CORS_ALLOWED_ORIGINS,
# and keeps Profiles authorization disabled until a real IAM adapter is delivered.

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
