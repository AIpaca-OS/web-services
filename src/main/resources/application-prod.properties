# Production profile
# Read database settings from environment variables expected in Docker/runtime.
spring.datasource.url=jdbc:postgresql://${DATABASE_URL:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:rumbo}
spring.datasource.username=${DATABASE_USER:}
spring.datasource.password=${DATABASE_PASSWORD:}

# Production-lean JPA behavior
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

# App port
server.port=${PORT:8080}

# Health endpoint used by the deployment readiness probe
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
