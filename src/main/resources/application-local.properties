# Loopback-only Sprint 3 demonstration; NEVER deploy with local profile enabled.
server.address=127.0.0.1
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rumbo_demo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Fictional tutor, driver and students only: requires explicit opt-in.
app.profiles.demo.enabled=${APP_PROFILES_DEMO_ENABLED:false}
app.demo.enabled=${APP_DEMO_ENABLED:false}
