name: Backend CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rumbo
          POSTGRES_USER: rumbo
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rumbo -d rumbo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rumbo
      SPRING_DATASOURCE_USERNAME: rumbo
      SPRING_DATASOURCE_PASSWORD: ci_only_password
      SPRING_JPA_DDL_AUTO: update
      PROFILES_AUTHORIZATION_ENABLED: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Generate an ephemeral signing secret
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Test and package
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify
