name: Backend CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rumbo
          POSTGRES_USER: rumbo
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rumbo -d rumbo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rumbo
      SPRING_DATASOURCE_USERNAME: rumbo
      SPRING_DATASOURCE_PASSWORD: ci_only_password
      SPRING_JPA_DDL_AUTO: update
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Test and package
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify
      - name: Build Render Docker image
        run: docker build --tag rumbo-os-backend:ci .
      - name: Smoke test Render production profile
        env:
          SPRING_PROFILES_ACTIVE: prod
          DEPLOYMENT_ACCESS_TOKEN: ci_preview_only
          DATABASE_URL: localhost
          DATABASE_PORT: "5432"
          DATABASE_NAME: rumbo
          DATABASE_USER: rumbo
          DATABASE_PASSWORD: ci_only_password
          SPRING_JPA_DDL_AUTO: update
        run: |
          java -jar target/rumbo-web-services-0.0.1-SNAPSHOT.jar > /tmp/rumbo-prod.log 2>&1 &
          APP_PID=$!
          trap 'tail -n 100 /tmp/rumbo-prod.log; kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then exit 1; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/api/v1/plans > /dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/routes)" = "401"
          curl -fsS -H "X-Rumbo-Preview-Key: $DEPLOYMENT_ACCESS_TOKEN" http://127.0.0.1:8080/api/v1/vehicles > /dev/null
          curl -fsS -D - -o /dev/null -H "Origin: http://localhost:4200" http://127.0.0.1:8080/api/v1/plans | grep -qi "access-control-allow-origin: http://localhost:4200"
