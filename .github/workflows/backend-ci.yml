name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rumbo
          POSTGRES_USER: rumbo
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rumbo -d rumbo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/rumbo
      SPRING_DATASOURCE_USERNAME: rumbo
      SPRING_DATASOURCE_PASSWORD: ci_only_password
      SPRING_JPA_DDL_AUTO: update
      PROFILES_AUTHORIZATION_ENABLED: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Test and package
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify
      - name: Build Render Docker image
        run: docker build --tag rumbo-os-backend:ci .
      - name: Smoke test Render production profile
        env:
          SPRING_PROFILES_ACTIVE: prod
          RUMBO_COURSE_CATALOG_ENABLED: "true"
          RENDER_POSTGRES_URL: postgresql://rumbo:ci_only_password@localhost:5432/rumbo
          SPRING_DATASOURCE_URL: ""
          SPRING_JPA_DDL_AUTO: update
          DEPLOYMENT_ACCESS_TOKEN: ci-only-preview-key
        run: |
          java -jar target/rumbo-web-services-0.0.1-SNAPSHOT.jar > /tmp/rumbo-prod.log 2>&1 &
          APP_PID=$!
          trap 'tail -n 100 /tmp/rumbo-prod.log; kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then exit 1; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/api/v1/plans | python3 -c '
          import json, sys
          plans = {plan["name"]: plan["referencePrice"] for plan in json.load(sys.stdin) if plan["active"]}
          assert plans == {"Freemium": 0, "Premium": 25, "Plus": 40}, plans
          '
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/routes)" = "401"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-Rumbo-Preview-Key: ci-only-preview-key' http://127.0.0.1:8080/api/v1/routes)" = "200"
